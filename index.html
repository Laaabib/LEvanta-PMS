    <script>
      // Compatibility guard: ensure window.fetch has both getter and setter in iframe environments
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch || originalFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return activeFetch || originalFetch;
                  },
                  set: function(fn) {
                    activeFetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          }
        } catch (err) {}
      })();
    </script>
